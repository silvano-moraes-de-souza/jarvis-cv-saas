<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Jarvis CV: Deterministic ATS scoring on 6 dimensions, a 5-model AI layer and Stripe billing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/><stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/><stop offset="0.45" stop-color="#f5fbff"/>
      <stop offset="0.55" stop-color="#f5fbff"/><stop offset="1" stop-color="#a371f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.30"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2430" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; } .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 1040px 180px; }
      @keyframes pulse { 0%, 100% { transform: scale(0.92); opacity: .65; } 50% { transform: scale(1.08); opacity: 1; } }
      .fade { opacity: 0; animation: fade 8s infinite; }
      @keyframes fade { 0% { opacity: 0; transform: translateY(8px); } 6% { opacity: 1; transform: none; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
      .grow { transform-box: fill-box; transform-origin: bottom; animation: grow 8s ease-out infinite; }
      @keyframes grow { 0% { transform: scaleY(0); } 18% { transform: scaleY(1); } 88% { transform: scaleY(1); opacity: 1; } 96%, 100% { transform: scaleY(1); opacity: 0; } }
      .growx { transform-box: fill-box; transform-origin: left; animation: growx 8s ease-out infinite; }
      @keyframes growx { 0% { transform: scaleX(0); } 18% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
      .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 8s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 35% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; opacity: 1; } 96%, 100% { opacity: 0; } }
      .flow { stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }
      .d1 { animation-delay: .3s; } .d2 { animation-delay: .6s; } .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; } .d5 { animation-delay: 1.5s; } .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 2.1s; } .d8 { animation-delay: 2.4s; } .d9 { animation-delay: 2.7s; }
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" opacity="0.55"/>
  <circle class="pulse" cx="1040" cy="180" r="175" fill="url(#glow)"/>
  <rect x="64" y="64" width="6" height="232" rx="3" fill="#a371f7"/>
  <text x="96" y="96" class="mono" font-size="16" fill="#a371f7" letter-spacing="2">SAAS · AI RESUME SCORING</text>
  <text x="92" y="167" class="sans" font-size="88" font-weight="800" fill="url(#shine)">Jarvis CV</text>
  <text x="96" y="212" class="sans" font-size="20" fill="#9aa7b2">Deterministic ATS scoring on 6 dimensions, a 5-model AI layer</text><text x="96" y="238" class="sans" font-size="20" fill="#9aa7b2">and Stripe billing</text>
  <rect x="96" y="262" width="79" height="28" rx="14" fill="#161b22" stroke="#a371f7" stroke-opacity="0.45"/><text x="136" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">FastAPI</text><rect x="185" y="262" width="63" height="28" rx="14" fill="#161b22" stroke="#a371f7" stroke-opacity="0.45"/><text x="217" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">React</text><rect x="258" y="262" width="88" height="28" rx="14" fill="#161b22" stroke="#a371f7" stroke-opacity="0.45"/><text x="302" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Supabase</text><rect x="356" y="262" width="71" height="28" rx="14" fill="#161b22" stroke="#a371f7" stroke-opacity="0.45"/><text x="392" y="281" text-anchor="middle" class="mono" font-size="13" fill="#c9d1d9">Stripe</text>
  <g><rect x="860" y="44" width="200" height="272" rx="12" fill="#f5f7fa"/><rect x="880" y="66" width="110" height="12" rx="6" fill="#1f2937"/><rect x="880" y="86" width="150" height="7" rx="3.5" fill="#9ca3af"/><rect x="880" y="112" width="150" height="7" rx="3.5" fill="#cbd5e1"/><rect x="880" y="132" width="130" height="7" rx="3.5" fill="#cbd5e1"/><rect x="880" y="152" width="160" height="7" rx="3.5" fill="#cbd5e1"/><rect x="880" y="172" width="110" height="7" rx="3.5" fill="#cbd5e1"/><rect x="880" y="192" width="150" height="7" rx="3.5" fill="#cbd5e1"/><rect x="880" y="212" width="140" height="7" rx="3.5" fill="#cbd5e1"/><rect x="880" y="232" width="90" height="7" rx="3.5" fill="#cbd5e1"/><rect x="880" y="252" width="155" height="7" rx="3.5" fill="#cbd5e1"/><rect x="880" y="272" width="120" height="7" rx="3.5" fill="#cbd5e1"/><rect class="growx d2" x="880" y="109" width="60" height="13" rx="4" fill="#a371f7" fill-opacity=".55"/><rect class="growx d4" x="880" y="149" width="48" height="13" rx="4" fill="#a371f7" fill-opacity=".55"/><rect class="growx d6" x="880" y="209" width="70" height="13" rx="4" fill="#a371f7" fill-opacity=".55"/><rect x="870" y="100" width="180" height="4" rx="2" fill="#22c55e" opacity=".8"><animate attributeName="y" values="100;300;100" dur="4s" repeatCount="indefinite"/></rect><circle cx="1160" cy="170" r="62" fill="none" stroke="#1f2937" stroke-width="14"/><circle cx="1160" cy="170" r="62" fill="none" stroke="#a371f7" stroke-width="14" stroke-linecap="round" transform="rotate(-90 1160 170)" stroke-dasharray="390" stroke-dashoffset="390"><animate attributeName="stroke-dashoffset" values="390;31;31" keyTimes="0;0.35;1" dur="8s" repeatCount="indefinite"/></circle><text x="1160" y="182" text-anchor="middle" class="sans" font-size="38" font-weight="800" fill="#f5fbff">92</text><text x="1160" y="204" text-anchor="middle" class="mono" font-size="11" fill="#8b949e">ATS SCORE</text></g>
</svg>
